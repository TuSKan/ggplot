name: ggplot CI

env:
  GOEXPERIMENT: simd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.26']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    - name: Verify formatting
      if: matrix.os == 'ubuntu-latest'
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Files with formatting issues:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Build all packages
      run: go build ./...

    - name: Run tests with coverage
      run: go test -v -coverprofile coverage.out -covermode atomic -timeout 120s ./...

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        $(go env GOPATH)/bin/golangci-lint run --timeout 10m

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build all examples
      run: |
        go build ./examples/geometries/point/
        go build ./examples/geometries/line/
        go build ./examples/geometries/bar/
        go build ./examples/geometries/histogram/
        go build ./examples/geometries/area/
        go build ./examples/geometries/smooth/

    - name: Run examples (generate outputs)
      run: |
        go run ./examples/geometries/point/
        go run ./examples/geometries/line/
        go run ./examples/geometries/bar/
        go run ./examples/geometries/histogram/
        go run ./examples/geometries/area/
        go run ./examples/geometries/smooth/

  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run benchmarks
      run: go test -bench=. -benchmem -run=^$ -timeout 120s ./...
