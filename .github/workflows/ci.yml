name: ggplot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.26']
        goexperiment: ['simd', '']
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    - name: Verify formatting
      if: matrix.os == 'ubuntu-latest' && matrix.goexperiment == 'simd'
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Files with formatting issues:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Build all packages
      run: go build ./...

    - name: Run tests with race detector and coverage
      run: go test -race -v -coverprofile coverage.out -covermode atomic -timeout 180s ./...

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.goexperiment == 'simd'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout 10m

  examples:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build all examples
      run: |
        go build ./examples/geometries/point/
        go build ./examples/geometries/line/
        go build ./examples/geometries/bar/
        go build ./examples/geometries/histogram/
        go build ./examples/geometries/area/
        go build ./examples/geometries/smooth/

    - name: Run examples (generate outputs)
      run: |
        go run ./examples/geometries/point/
        go run ./examples/geometries/line/
        go run ./examples/geometries/bar/
        go run ./examples/geometries/histogram/
        go run ./examples/geometries/area/
        go run ./examples/geometries/smooth/

  benchmarks:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run benchmarks
      run: go test -bench=. -benchmem -run=^$ -timeout 180s ./...
